# 左右共通の設定（ZMK は circa40_left / circa40_right の両方に対して
# この circa40.conf を読み込む）。
# 左右ともディープスリープへ移行しない。
CONFIG_ZMK_SLEEP=n

# NOTE: CONFIG_ZMK_POINTING はここには置かない。
# トラックボールは Right(central) にしか無いため、
# circa40_right.conf 側でのみ有効化する。

############################################################
# Bluetooth 安定化（zmk-config-AroundFortyRB から移植、左右共通）
# 左手が反応しなくなる症状の切り分け用。
############################################################

# BLE 試験的機能を無効化（macOS との相性を考慮）
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=n

# BT 受信スレッドのスタック
CONFIG_BT_RX_STACK_SIZE=2048

# BT 送信スレッドのスタック。導出値（hidden）なので _WITH_PROMPT を立てないと
# 指定値が黙って捨てられる。peripheral の既定は 768 のため左右を 1024 に揃える。
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=1024

# ACL バッファ（BLE 最大ペイロード 251）
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# 接続間隔を 15ms 固定（1.25ms * 12）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# 2M PHY を無効化（安定性優先）
CONFIG_BT_CTLR_PHY_2M=n

# 接続数上限（左右で揃える）
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# スレッドのスタック
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
