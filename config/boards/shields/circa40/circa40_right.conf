CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y


# Bluetooth 安定化（AroundFortyRB から移植）。左右共通分は circa40.conf。
# 送信出力を最大（+8dBm）にする
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Split Central 側ランタイム処理スタック（peripheral では無視されるので右のみ）
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=3096
# Input subsystem 用スタック（トラックボールは右のみ）
CONFIG_INPUT_THREAD_STACK_SIZE=2048
