# Circa40 Left = Split の peripheral 側。
# トラックボール等のポインティングハードウェアは Right(central) 側にのみ
# 搭載されているため、この側で有効化すべきものは現状ない。

# ポインティングは Right(central) 専用。
# peripheral 側で有効にしてもマウス HID のコードが積まれるだけで使われない。
CONFIG_ZMK_POINTING=n

# Bluetooth 安定化（AroundFortyRB から移植）。左右共通分は circa40.conf。
# Split Peripheral 側 BLE スタック（central では無視されるので左のみ）
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=2048
