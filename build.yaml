include:
  - board: xiao_ble//zmk
    shield: circa40_left
    artifact-name: circa40-left
  - board: xiao_ble//zmk
    shield: circa40_right
    artifact-name: circa40-right-central
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: circa40-settings-reset

  # トラックボール切り分け用：USB シリアルにドライバログを出す Right ファーム。
  # 通常運用では使わない（USB 接続前提・電池消費が増える）。
  - board: xiao_ble//zmk
    shield: circa40_right
    cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
    artifact-name: circa40-right-logging
